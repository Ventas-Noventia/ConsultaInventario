<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceso | Inventario Noventia</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3f4;font-family:Arial,sans-serif;color:#17343b;padding:20px}
    .card{width:min(430px,100%);background:#fff;border-radius:22px;padding:34px;box-shadow:0 18px 50px rgba(17,53,62,.13)}
    .marca{font-size:30px;font-weight:800;letter-spacing:2px;color:#174f5b}.tag{margin:6px 0 28px;color:#63777c}
    label{display:block;font-weight:700;margin:15px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #cfdadd;border-radius:10px;font-size:16px;outline:none}input:focus{border-color:#1c7181;box-shadow:0 0 0 3px rgba(28,113,129,.12)}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:#174f5b;color:#fff;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
    .msg{min-height:22px;margin-top:15px;font-size:14px;color:#b42318}.nota{margin-top:22px;padding-top:18px;border-top:1px solid #e7edef;font-size:13px;color:#6b7c80;line-height:1.45}
  </style>
</head>
<body>
  <main class="card">
    <div class="marca">NOVENTIA</div>
    <p class="tag">Sistema interno de inventario</p>
    <form id="loginForm">
      <label for="correo">Correo</label>
      <input id="correo" type="email" autocomplete="username" required>
      <label for="contrasena">Contraseña</label>
      <input id="contrasena" type="password" autocomplete="current-password" required>
      <button id="entrar" type="submit">Iniciar sesión</button>
      <div id="mensaje" class="msg" aria-live="polite"></div>
    </form>
    <div class="nota">El administrador entra al actualizador. El usuario general entra únicamente a la consulta.</div>
  </main>
  <script type="module">
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
    import { auth, db } from "./js/firebase.js";

    const form = document.getElementById("loginForm");
    const btn = document.getElementById("entrar");
    const mensaje = document.getElementById("mensaje");

    async function redirigir(usuario) {
      const snap = await getDoc(doc(db, "usuarios", usuario.uid));
      if (!snap.exists() || snap.data().activo === false) throw new Error("Tu cuenta no tiene un perfil activo.");
      const rol = snap.data().rol;
      window.location.replace(rol === "admin" ? "./actualizador/index.html" : "./consulta/index.html");
    }

    onAuthStateChanged(auth, async (usuario) => {
      if (!usuario) return;
      try { await redirigir(usuario); } catch (error) { mensaje.textContent = error.message; }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault(); mensaje.textContent = ""; btn.disabled = true; btn.textContent = "Validando...";
      try {
        const credencial = await signInWithEmailAndPassword(auth, correo.value.trim(), contrasena.value);
        await redirigir(credencial.user);
      } catch (error) {
        const mensajes = {
          "auth/invalid-credential": "Correo o contraseña incorrectos.",
          "auth/too-many-requests": "Demasiados intentos. Espera unos minutos.",
          "auth/user-disabled": "Esta cuenta fue desactivada."
        };
        mensaje.textContent = mensajes[error.code] || error.message || "No fue posible iniciar sesión.";
        btn.disabled = false; btn.textContent = "Iniciar sesión";
      }
    });
  </script>
</body>
</html>
